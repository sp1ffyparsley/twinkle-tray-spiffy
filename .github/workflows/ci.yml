name: Verify Spiffy Fork

on:
  push:
  pull_request:

permissions:
  contents: read

# New commits supersede old verification runs. Do not keep multiple expensive
# Windows native builds or Mac packages queued for the same branch.
concurrency:
  group: spiffy-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows source and package
    # The upstream windows-accent-colors native addon still requires MSVC
    # v143/Visual Studio 2022. VS 2026 breaks its deprecated coroutine header
    # and older node-gyp versions cannot reliably discover VS 18.x.
    # Keep an actual native build in CI rather than using --ignore-scripts.
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run regression tests
        # Some Windows-native fixtures reuse loopback/native resources; do not
        # launch test files against each other on a headless shared runner.
        # Preserve the complete suite, but cap a stuck native fixture so CI
        # produces a usable failure log instead of holding the runner forever.
        timeout-minutes: 5
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Compile renderer
        run: npm run parcel-build
      - name: Build unsigned Windows QA package without publishing
        run: npx electron-builder --x64 --win nsis --publish never

  mac-source:
    name: macOS source and shared-panel verification
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript dependencies without Windows native install scripts
        run: npm ci --ignore-scripts
      - name: Check shared and Mac-specific source
        run: |
          node --check src/MacMain.js
          node --check src/MacDisplayBackend.js
          node --check src/MacBuiltInBackend.js
          node --test tests/mac-*.test.js tests/popup-focus-guard.test.js tests/preset-appearance.test.js tests/quick-presets.test.js
      - name: Compile the shared React brightness panel
        run: npm run parcel-build
      - name: Package unsigned Apple Silicon Mac app for structural QA
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --arm64 --config electron-builder.mac.json --publish never
      - name: Verify the bundled Mac executable and shared UI
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist-macos -type d -name 'Twinkle Tray Spiffy.app' -print -quit)
          test -n "$app"
          test -f "$app/Contents/MacOS/Twinkle Tray Spiffy"
          asar="$app/Contents/Resources/app.asar"
          test -f "$asar"
          node -e '
            const asar = require("@electron/asar");
            const p = process.argv[1];
            const required = [
              "src/MacMain.js", "src/MacDisplayBackend.js",
              "src/MacBuiltInBackend.js", "src/QuickPresets.js",
              "src/MonitorWarmthMapping.js", "src/panel-preload.js",
              "build/index.html", "build/mac-settings.html",
              "build/panel.799762b8.js"
            ];
            for (const item of required) {
              if (!asar.extractFile(p,item).length) throw Error("Missing Mac bundle resource: "+item);
            }
            if (JSON.parse(asar.extractFile(p,"package.json")).main !== "src/MacMain.js")
              throw Error("Wrong packaged Mac entry point");
            console.log("MAC_BUNDLE_STRUCTURE_VERIFIED");
          ' "$asar"
